{# Renders one registration field inside the competitions-page modal's
   CSS grid (.reg-modal-grid / .rmg / .rmg--full) — expects `f` in context. #}
<div class="rmg{{ ' rmg--full' if f.width == 'full' else '' }}">
  <label>{{ f.label }} {% if f.is_required %}<span class="req">*</span>{% else %}<span class="form-optional">{{ t.compModalEmailOpt }}</span>{% endif %}</label>
  {% if f.field_type == 'select' %}
  <select name="{{ f.field_key }}" {% if f.is_required %}required{% endif %}>
    <option value="">{{ f.placeholder or 'Select' }}</option>
    {% for opt in f.options %}<option>{{ opt }}</option>{% endfor %}
  </select>
  {% elif f.field_type == 'textarea' %}
  <textarea name="{{ f.field_key }}" rows="3" placeholder="{{ f.placeholder }}" {% if f.is_required %}required{% endif %}></textarea>
  {% else %}
  <input type="{{ f.field_type }}" name="{{ f.field_key }}" placeholder="{{ f.placeholder }}" {% if f.field_type == 'number' %}min="1" max="120"{% endif %} {% if f.is_required %}required{% endif %}/>
  {% endif %}
</div>
